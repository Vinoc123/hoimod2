l_russian:
 hoimod_camp:0 "Концлагерь"
 hoimod_camp_desc:0 "Один на регион. Снижает цель сопротивления и отдаёт контролёру больше местных заводов. Гарнизон оккупации в этом регионе требуется ещё раз: люди и снаряжение списываются шаблоном подавления, который выбран в окне оккупации. Каждый месяц население региона падает на 0.4%, пока не останется 50 тысяч."
 hoimod_camp_plural:0 "Концлагеря"

 hoimod_camp_construction:0 "Лагерная администрация"
 hoimod_camp_construction_desc:0 "Позволяет фашистской Германии строить концлагеря в оккупированных регионах, которые не являются её ядрами."
