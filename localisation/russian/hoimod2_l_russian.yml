l_russian:
 hoimod_camp:0 "Концлагерь"
 hoimod_camp_desc:0 "Кнопка в окне строек, в сооружениях региона. Строится только там, где Германия оккупирует чужую землю и это не её ядро. Снижает цель сопротивления и отдаёт контролёру больше местных заводов. Гарнизон оккупации в этом регионе требуется ещё раз: люди и снаряжение списываются шаблоном подавления, который выбран в окне оккупации. Каждый месяц население региона падает на 0.4%, пока не останется 50 тысяч."
 hoimod_camp_plural:0 "Концлагеря"
 hoimod_camp_construction:0 "Лагерная администрация"
 hoimod_camp_construction_desc:0 "Позволяет фашистской Германии строить концлагеря в оккупированных регионах, которые не являются её ядрами."

 hoimod_peace_category:0 "Мирная конференция"
 hoimod_peace_category_desc:0 "Предложить мир без капитуляции. Откроется конференция: вы и противник садитесь за две делегации и делите спорные регионы обеих стран. Своя земля, которая всё ещё под вашим контролем, на стол не попадает. Набранное возвращается вашим странам. Если предлагает противник, ответ тоже здесь, без всплывающего окна."

 hoimod_answer_yes:0 "Принять мирную конференцию"
 hoimod_answer_yes_desc:0 "[hoimod_g_proposer.GetNameDefCap] предлагает конференцию с [hoimod_g_target.GetNameDef]. Повод: [HoimodCase]. Репарации: [HoimodRep]."
 hoimod_answer_no:0 "Отказать в мирной конференции"
 hoimod_answer_no_desc:0 "Отказ закроет эту пару на 180 дней. Повод: [HoimodCase]. Репарации: [HoimodRep]."

 hoimod_offer_none:0 "Предложить конференцию [From.GetNameDef]"
 hoimod_offer_none_desc:0 "Без репараций. Вы занимаете [?ROOT.hoimod_held@FROM|0] рег., противник [?ROOT.hoimod_they_held@FROM|0]. В окне делится только спорная земля. До преимущества осталось [?ROOT.hoimod_adv_left@FROM|0] дн. До мёртвого фронта и войны без линии фронта осталось [?ROOT.hoimod_year_left@FROM|0] дн."

 hoimod_split_tt:0 "Откроется мирная конференция. Обе страны садятся за стол как один проигравший союз. Вы и противник играете за две делегации вне карты и делите спорные регионы. Свою удержанную землю забрать нельзя. После стола набранные регионы возвращаются вашим странам."
 hoimod_split_losers:0 "Общий стол"
 hoimod_split_winners:0 "Делегации"
 HOIMOD_BENCH_A:0 "Делегация инициатора"
 HOIMOD_BENCH_B:0 "Делегация противника"
 HOIMOD_VAULT:0 "Хранение"
 hoimod_offer_light:0 "Конференция с лёгкими репарациями: [From.GetNameDef]"
 hoimod_offer_light_desc:0 "Год выплат, 8% товаров. До преимущества осталось [?ROOT.hoimod_adv_left@FROM|0] дн. До мёртвого фронта и войны без линии фронта осталось [?ROOT.hoimod_year_left@FROM|0] дн."
 hoimod_offer_medium:0 "Конференция со средними репарациями: [From.GetNameDef]"
 hoimod_offer_medium_desc:0 "Два года выплат, 15% товаров. Только при преимуществе. До преимущества осталось [?ROOT.hoimod_adv_left@FROM|0] дн."
 hoimod_offer_heavy:0 "Конференция с тяжёлыми репарациями: [From.GetNameDef]"
 hoimod_offer_heavy_desc:0 "Три года выплат, 25% товаров. Только при преимуществе. До преимущества осталось [?ROOT.hoimod_adv_left@FROM|0] дн."

 hoimod_not_ready_tt:0 "Срок ещё не вышел или повод не сложился."
 hoimod_tier_light_tt:0 "Лёгкие репарации можно приложить, когда конференцию уже можно созвать."
 hoimod_tier_medium_tt:0 "Средние репарации только если одна сторона заметно сильнее."
 hoimod_tier_heavy_tt:0 "Тяжёлые репарации только если одна сторона заметно сильнее."

