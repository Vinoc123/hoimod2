l_english:
 hoimod_camp:0 "Concentration Camp"
 hoimod_camp_desc:0 "The button is in the construction screen, with the state buildings. It can be built only where Germany occupies foreign land that is not a German core. Lowers the resistance target and hands the controller a larger share of local factories. The state's occupation garrison bill is charged again: manpower and equipment are drawn from the suppression template selected in the occupation screen. State population falls by 0.4% each month until 50,000 people remain."
 hoimod_camp_plural:0 "Concentration Camps"
 hoimod_camp_construction:0 "Camp Administration"
 hoimod_camp_construction_desc:0 "Lets fascist Germany build concentration camps in occupied states that are not German cores."

 hoimod_peace_category:0 "Peace Conference"
 hoimod_peace_category_desc:0 "Offer peace without capitulation. This splits the front instead of letting you pick annexations. Each side keeps the other side's regions it already controls, at their normal price. Land you held before the war and still control stays yours. If the enemy offers, the answer is here too, without a popup."

 hoimod_answer_yes:0 "Accept the peace conference"
 hoimod_answer_yes_desc:0 "[hoimod_g_proposer.GetNameDefCap] offers a conference with [hoimod_g_target.GetNameDef]. Cause: [HoimodCase]. Reparations: [HoimodRep]."
 hoimod_answer_no:0 "Refuse the peace conference"
 hoimod_answer_no_desc:0 "A refusal closes this pair for 180 days. Cause: [HoimodCase]. Reparations: [HoimodRep]."

 hoimod_offer_none:0 "Offer a conference to [From.GetNameDef]"
 hoimod_offer_none_desc:0 "No reparations. You hold [?ROOT.hoimod_held@FROM|0] regions, they hold [?ROOT.hoimod_they_held@FROM|0]. Each side keeps only that. Advantage in [?ROOT.hoimod_adv_left@FROM|0] days. A dead front or a war with no front line in [?ROOT.hoimod_year_left@FROM|0] days."
 hoimod_offer_light:0 "Conference with light reparations: [From.GetNameDef]"
 hoimod_offer_light_desc:0 "One year of payments, 8% consumer goods. Advantage in [?ROOT.hoimod_adv_left@FROM|0] days. A dead front or a war with no front line in [?ROOT.hoimod_year_left@FROM|0] days."
 hoimod_offer_medium:0 "Conference with moderate reparations: [From.GetNameDef]"
 hoimod_offer_medium_desc:0 "Two years of payments, 15% consumer goods. Only with an advantage. Advantage in [?ROOT.hoimod_adv_left@FROM|0] days."
 hoimod_offer_heavy:0 "Conference with heavy reparations: [From.GetNameDef]"
 hoimod_offer_heavy_desc:0 "Three years of payments, 25% consumer goods. Only with an advantage. Advantage in [?ROOT.hoimod_adv_left@FROM|0] days."

 hoimod_not_ready_tt:0 "The time has not run out, or the cause is not there yet."
 hoimod_tier_light_tt:0 "Light reparations can be attached once the conference itself can be called."
 hoimod_tier_medium_tt:0 "Moderate reparations require one side to be clearly ahead."
 hoimod_tier_heavy_tt:0 "Heavy reparations require one side to be clearly ahead."

 hoimod2.1.t:0 "Peace Conference Offer"
 hoimod2.1.d:0 "[hoimod_proposer_et.GetNameDefCap] offers a peace conference with [hoimod_target_et.GetNameDef]. Cause: [HoimodCase]. Reparations: [HoimodRep]."
 hoimod2.1.a:0 "Accept"
 hoimod2.1.b:0 "Refuse"

 hoimod_case_advantage:0 "one side is clearly ahead"
 hoimod_case_frozen:0 "the front is static, the losses are heavy, and there is no winner"
 hoimod_case_nofront:0 "there is no shared front line"
 hoimod_rep_none:0 "none"
 hoimod_rep_light:0 "light, one year"
 hoimod_rep_medium:0 "moderate, two years"
 hoimod_rep_heavy:0 "heavy, three years"

 hoimod_rep_pay_light:0 "Light Reparations"
 hoimod_rep_pay_light_desc:0 "Part of the civilian industry goes to the conference winner."
 hoimod_rep_get_light:0 "Light Reparations"
 hoimod_rep_get_light_desc:0 "Payments from the losing country free up civilian factories."
 hoimod_rep_pay_medium:0 "Moderate Reparations"
 hoimod_rep_pay_medium_desc:0 "Part of the civilian industry goes to the conference winner."
 hoimod_rep_get_medium:0 "Moderate Reparations"
 hoimod_rep_get_medium_desc:0 "Payments from the losing country free up civilian factories."
 hoimod_rep_pay_heavy:0 "Heavy Reparations"
 hoimod_rep_pay_heavy_desc:0 "Part of the civilian industry goes to the conference winner."
 hoimod_rep_get_heavy:0 "Heavy Reparations"
 hoimod_rep_get_heavy_desc:0 "Payments from the losing country free up civilian factories."
